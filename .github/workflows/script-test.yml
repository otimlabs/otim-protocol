name: Utility Script Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/protocol-cli.rs'
      - '.github/deployment-config.yaml'
  workflow_dispatch:

jobs:
  test-protocol-cli:
    name: Test protocol CLI script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2fcdc490d667999e01ddbbf0f2823181beef6b39 # v1.15.0

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: protocol-cli-test

      - name: Install rust-script
        run: |
          curl -LsSf https://github.com/fornwall/rust-script/releases/latest/download/rust-script-x86_64-unknown-linux-gnu.tar.gz | tar xzf -
          sudo install rust-script /usr/local/bin/

      - name: Run tests
        run: |
          echo "Running tests for protocol CLI script..."
          rust-script --test .github/scripts/protocol-cli.rs
