name: Deploy Protocol Contracts

on:
  workflow_call:
    inputs:
      env_file:
        description: Environment file to validate
        type: string
        default: ".github/networks/testnet/.env-otim-testnet"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-contracts:
    name: Validate Contract Addresses
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.validate.outputs.exit-code }}
    container:
      image: ghcr.io/otimlabs/otim-protocol:ahmad-contracts_deployment_workflow
    env:
      ENV_FILE: ${{ inputs.env_file || '.github/networks/testnet/.env-otim-testnet' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Validate contract addresses
        id: validate
        run: |
          set +e  # Do not exit on error
          rust-script /scripts/protocol-cli.rs validate-contracts --config-file /scripts/deployment-config.yaml --env-file ${{ env.ENV_FILE }} --update
          EXIT_CODE=$?
          echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
        continue-on-error: true

  create-update-pr:
    name: Create Contract Update PR
    runs-on: ubuntu-latest
    needs: validate-contracts
    if: needs.validate-contracts.outputs.exit_code == '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Create contract update PR
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          commit-message: "sync: contract addresses"
          title: "Sync: contract addresses"
          body: |
            Contract address validation detected changes.
            
            **Environment File**: `${{ inputs.env_file || '.github/networks/testnet/.env-otim-testnet' }}`
            **Run**: [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          branch: deploy/update-addresses
          branch-suffix: short-commit-hash
          base: main
          delete-branch: true

  trigger-deployment:
    name: Trigger Downstream Deployment
    runs-on: ubuntu-latest
    needs: validate-contracts
    if: needs.validate-contracts.outputs.exit_code == '0'
    steps:
      - name: Generate GitHub App Token
        id: bot_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Trigger downstream deployment
        if: steps.validate.outputs.exit-code == '0'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v3
        with:
          token: ${{ steps.bot_token.outputs.token }}
          repository: otimlabs/otim-infrastructure
          event-type: protocol-contract-deploy
          client-payload: |
            {
              "protocol_ref": "latest"
            }
